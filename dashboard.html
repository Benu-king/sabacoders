<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Saba Coders · Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Playfair+Display:wght@500;600&family=Noto+Serif+Ethiopic:wght@500;600&display=swap">
<style>
:root{--bg:#060B1F;--panel:#0e1424;--ink:#EEF0F8;--muted:#9AA6C9;--gold:#C9A66B;--gold2:#E8C98B;--cyan:#7FE7FF;--line:rgba(255,255,255,.14);--ok:#4fc3a8;--bad:#ff9a9a;
--sans:"Inter","Noto Sans Ethiopic",system-ui,sans-serif;--serif:"Playfair Display","Noto Serif Ethiopic",Georgia,serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(80% 50% at 70% 0,#13286b,var(--bg) 60%) fixed;color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100vh;-webkit-text-size-adjust:100%}
html[lang="am"] body{line-height:1.8}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0 0 10px}
h1{font-size:clamp(1.7rem,4vw,2.4rem)}h2{font-size:1.4rem}h3{font-size:1.1rem}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left));background:rgba(6,11,31,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:600;font-size:1.15rem;text-decoration:none;color:var(--gold2)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:.92rem;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center}
nav a:hover{color:#fff;background:rgba(255,255,255,.08)}nav a[aria-current]{color:#0A1230;background:var(--gold2)}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page{width:min(1100px,100% - 32px);margin:28px auto 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--gold);background:linear-gradient(120deg,var(--gold2),var(--gold));color:#0A1230;font:600 .92rem var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--gold)}
.btn.bad{background:transparent;color:var(--bad);border-color:rgba(255,154,154,.5)}.btn.sm{min-height:36px;padding:0 12px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.in{width:100%;min-height:44px;background:#080e20;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:10px 12px;font:inherit}
textarea.in{min-height:120px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label .in{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink)}
label.chk{flex-direction:row;align-items:center;text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink);min-height:44px}
label.chk input{width:20px;height:20px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.stack{display:grid;gap:14px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.74rem;font-weight:600;border:1px solid var(--line)}
.s-published{color:var(--ok);border-color:var(--ok)}.s-pending_review{color:var(--gold2);border-color:var(--gold)}.s-rejected{color:var(--bad);border-color:var(--bad)}.s-draft,.s-unpublished{color:var(--muted)}
.cc{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}.cc .body{padding:16px;display:grid;gap:8px}
.cc .th{height:140px;background:linear-gradient(135deg,#24408f,#0b1840);display:grid;place-items:center;font:700 2rem ui-monospace,monospace;color:rgba(255,255,255,.8)}
.cc .th img{width:100%;height:100%;object-fit:cover}
.empty{border:1px dashed rgba(255,255,255,.25);border-radius:16px;padding:32px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:500 1.3rem var(--serif);margin-bottom:6px}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--line)}.banner.bad{border-color:var(--bad);color:var(--bad)}.banner.warn{border-color:var(--gold);color:var(--gold2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 .9rem var(--sans);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold2);color:#0A1230;border-color:var(--gold2)}.tabs button[disabled]{opacity:.4;cursor:not-allowed}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:rgba(255,255,255,.02)}summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:8px}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}.ck i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:1px solid var(--line)}.ck.ok i{background:var(--ok);color:#06231c;border-color:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:8px;max-width:min(420px,100% - 32px)}
.t{padding:12px 16px;border-radius:12px;background:#10204f;border:1px solid var(--ok);box-shadow:0 10px 30px rgba(0,0,0,.5)}.t.err{border-color:var(--bad);background:#33121a}
.login{max-width:420px;margin:12vh auto}
img.prev{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
